name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests with coverage (thresholds 80%)
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct}% |`);
            console.log(["| metric | coverage |", "| --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Production bundle contains no mock backend
        run: "! grep -l 'setupWorker\\|mockServiceWorker' dist/assets/*.js"

  docker:
    name: Docker image (nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pos-demo-react:ci .
      - name: Run against a stub upstream
        run: |
          mkdir -p /tmp/upstream && echo pong > /tmp/upstream/ping
          (cd /tmp/upstream && python3 -m http.server 9999 >/dev/null 2>&1 &)
          docker run -d --name web --network host \
            -e PORT=8080 -e API_UPSTREAM=http://127.0.0.1:9999 pos-demo-react:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
      - name: Smoke test headers, caching, SPA fallback and proxy
        run: |
          set -euo pipefail
          headers=$(curl -fsS -D - -o /dev/null localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi "content-security-policy: default-src 'self'"
          echo "$headers" | grep -qi "x-frame-options: DENY"
          echo "$headers" | grep -qi "x-content-type-options: nosniff"
          echo "$headers" | grep -qi "cache-control: no-cache"
          curl -fsS localhost:8080/productos | grep -q '<div id="root">'
          asset=$(curl -fsS localhost:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          asset_headers=$(curl -fsS -D - -o /dev/null -H 'Accept-Encoding: gzip' "localhost:8080$asset")
          echo "$asset_headers" | grep -qi "cache-control: public, max-age=31536000, immutable"
          echo "$asset_headers" | grep -qi "content-encoding: gzip"
          echo "$asset_headers" | grep -qi "content-security-policy"
          test "$(curl -fsS localhost:8080/api/ping)" = pong
      - name: Logs
        if: failure()
        run: docker logs web

  e2e:
    name: E2E (Playwright, mocked API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
